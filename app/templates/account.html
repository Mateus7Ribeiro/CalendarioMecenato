{% extends 'base.html' %}
{% block title %}Minha conta{% endblock %}
{% block content %}
<section class="form-card account-card">
  <div class="eyebrow">Sua conta</div><h1>Minha conta</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="name">Nome</label><input id="name" name="name" value="{{ current_user.name }}" maxlength="120" required></div>
    <div class="field"><label>E-mail</label><input value="{{ current_user.email }}" disabled></div>
    <hr>
    <h2>Alterar senha</h2><p class="muted">Deixe os campos em branco para manter sua senha atual.</p>
    <div class="field"><label for="current_password">Senha atual</label><input id="current_password" type="password" name="current_password" autocomplete="current-password"></div>
    <div class="field"><label for="new_password">Nova senha</label><input id="new_password" type="password" name="new_password" minlength="6" autocomplete="new-password"></div>
    <div class="field"><label for="password_confirmation">Confirmar nova senha</label><input id="password_confirmation" type="password" name="password_confirmation" minlength="6" autocomplete="new-password"></div>
    <div class="form-actions"><button class="button button-primary" type="submit">Salvar alterações</button><a href="{{ url_for('main.calendar') }}">Cancelar</a></div>
  </form>
</section>
{% endblock %}
