{% extends 'base.html' %}{% block title %}{{ title }}{% endblock %}{% block content %}<section class="form-card"><div class="eyebrow">Área administrativa</div><h1>{{ title }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><div class="field"><label>Clube</label><select name="club_id" required>{% for club in clubs %}<option value="{{ club.id }}" {% if event and event.club_id == club.id %}selected{% endif %}>{{ club.name }}</option>{% endfor %}</select></div><div class="field"><label>Data e hora</label><input type="datetime-local" name="event_date" value="{{ event.event_date.strftime('%Y-%m-%dT%H:%M') if event else '' }}" required></div><div class="field"><label>Título do livro</label><input name="book_title" value="{{ event.book_title if event else '' }}" required></div><div class="field"><label>Autor</label><input name="book_author" value="{{ event.book_author if event else '' }}" required></div><div class="field full"><label>URL da capa</label><input type="url" name="cover_url" value="{{ event.cover_url if event else '' }}"></div><div class="field full"><label>Sinopse</label><textarea name="synopsis">{{ event.synopsis if event else '' }}</textarea></div><div class="field"><label>Formato</label><select name="location_type"><option value="presential" {% if not event or event.location_type == 'presential' %}selected{% endif %}>Presencial</option><option value="online" {% if event and event.location_type == 'online' %}selected{% endif %}>Online</option></select></div><div class="field"><label>Local ou link</label><input name="location_details" value="{{ event.location_details if event else '' }}"></div><label class="check full"><input type="checkbox" name="show_rsvp_publicly" {% if not event or event.show_rsvp_publicly %}checked{% endif %}> Exibir contagem de confirmações no calendário</label></div><div class="form-actions"><button class="button button-primary">Salvar encontro</button><a href="{{ url_for('admin.dashboard') }}">Cancelar</a></div></form></section>{% endblock %}
